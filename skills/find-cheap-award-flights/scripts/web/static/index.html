<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Award Flights</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { ink: '#0b1020', brand: { 600:'#4f46e5', 500:'#6366f1', 50:'#eef2ff' } },
        fontFamily: { sans: ['Inter','ui-sans-serif','system-ui','sans-serif'] },
      } }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-slate-50 text-ink font-sans antialiased">
  <header class="sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-5 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 font-extrabold tracking-tight">
        <span class="inline-grid place-items-center w-7 h-7 rounded-lg bg-brand-600 text-white">✈</span>
        Award<span class="text-brand-600">Flights</span>
      </div>
      <nav class="text-sm font-medium text-slate-500 flex gap-6">
        <a href="#search" class="hover:text-ink">Search</a>
        <a href="#favorites" class="hover:text-ink" onclick="App.loadFavorites()">Favorites</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 pb-24">
    <!-- Hero + search -->
    <section id="search" class="pt-10">
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Cheapest flights, paid in miles.</h1>
      <p class="text-slate-500 mt-2">Search live award space across your airlines for the exact days you fly.</p>

      <form id="searchForm" class="mt-6 bg-white rounded-2xl shadow-sm border border-slate-200 p-4 md:p-5">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
          <div class="md:col-span-3">
            <label class="lbl">From</label>
            <input name="from" value="NYC" class="inp" placeholder="NYC / JFK" />
            <div class="chips" data-target="from"><span>NYC</span><span>DC</span></div>
          </div>
          <div class="md:col-span-3">
            <label class="lbl">To</label>
            <input name="to" value="PHX" class="inp" placeholder="PHX" />
            <div class="chips" data-target="to"><span>PHX</span><span>LAX</span><span>MIA</span></div>
          </div>
          <div class="md:col-span-2">
            <label class="lbl">Start date</label>
            <input name="start" type="date" class="inp" />
          </div>
          <div class="md:col-span-2">
            <label class="lbl">End date</label>
            <input name="end" type="date" class="inp" />
          </div>
          <div class="md:col-span-2">
            <label class="lbl">Cabin</label>
            <select name="cabin" class="inp">
              <option value="economy">Economy / Prem</option>
              <option value="business">Business / First</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 mt-3 items-end">
          <div class="md:col-span-5">
            <label class="lbl">Airlines</label>
            <div id="airlines" class="flex flex-wrap gap-1.5 text-sm"></div>
          </div>
          <div class="md:col-span-2">
            <label class="lbl">Max miles</label>
            <input name="max_miles" type="number" value="17000" class="inp" />
          </div>
          <div class="md:col-span-3">
            <label class="lbl">Mode</label>
            <div class="seg" id="mode">
              <button type="button" data-mode="live" class="on">Live <span class="text-xs opacity-70">real-time</span></button>
              <button type="button" data-mode="cached">SkyView <span class="text-xs opacity-70">cached</span></button>
            </div>
          </div>
          <div class="md:col-span-2">
            <button type="submit" class="btn-primary w-full">Search</button>
          </div>
        </div>
      </form>
      <p id="searchHint" class="text-xs text-slate-400 mt-2"></p>
    </section>

    <!-- Results -->
    <section id="results" class="mt-8 hidden">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-bold">Results <span id="resultCount" class="text-slate-400 font-medium"></span></h2>
        <div class="seg" id="view">
          <button type="button" data-view="list" class="on">List</button>
          <button type="button" data-view="table">Table</button>
        </div>
      </div>
      <div id="resultsBody"></div>
    </section>

    <!-- Favorites -->
    <section id="favorites" class="mt-12">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-bold">Favorites <span id="favCount" class="text-slate-400 font-medium"></span></h2>
        <button id="reloadAll" class="btn-ghost">↻ Reload all</button>
      </div>
      <div id="favBody" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
